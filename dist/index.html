</style></head><body><main class="app"><header class="top"><div><div class="eyebrow">LOCAL TWO-PLAYER BOARD GAME</div><h1 class="title">ORB</h1><p class="lead">置く。押す。軌道が変わる。</p></div><div class="tag">NO INTERNET • WHITE / BLACK</div></header><section class="card arena"><div class="mode-bar"><button class="mode active" data-mode="1">1</button><button class="mode" data-mode="2">2</button><button class="mode" data-mode="3">3</button><button class="mode" data-mode="4">4</button></div><div class="frame"><div id="board" class="board"></div></div><button id="orbit" class="orbit-button" disabled>◎ オービト</button><div class="hint">ビー玉を置いたら、必ずこのボタンを押します</div></section><aside class="card panel"><div><div class="label">Turn</div><div id="turn" class="turn white">白の番</div></div><div class="scores"><div class="score white"><div class="label">White</div><b id="whiteScore">0</b><span id="whiteLeft" class="count">残り 8 個</span></div><div class="score black"><div class="label">Black</div><b id="blackScore">0</b><span id="blackLeft" class="count">残り 8 個</span></div></div><div><div class="label">First player</div><div class="actions"><button id="whiteFirst" class="btn active">白が先攻</button><button id="blackFirst" class="btn">黒が先攻</button></div></div><div id="message" class="message">空いているマスにビー玉を置いてください。</div><button id="reset" class="btn">最初からやり直す</button><div class="rules"><strong>遊び方</strong><br>自分の番に1個置き、「オービト」を押します。選択した軌道に沿ってビー玉が1マス移動します。移動後に縦・横・斜め4個並べば勝ち。勝負がつくまで続けます。</div></aside></main><script>
const outer=[[0,0],[1,0],[2,0],[3,0],[3,1],[3,2],[3,3],[2,3],[1,3],[0,3],[0,2],[0,1]],inner=[[1,1],[2,1],[2,2],[1,2]],$=id=>document.getElementById(id);let board,turn,placed,gameOver,first='white',mode=1;function fresh(){board=Array.from({length:4},()=>Array(4).fill(null));turn=first;placed=false;gameOver=false;render()}function score(p){return board.flat().filter(v=>v===p).length}function findLine(p){for(let y=0;y<4;y++)for(let x=0;x<4;x++)for(const[dx,dy]of[[1,0],[0,1],[1,1],[1,-1]]){const line=[];for(let i=0;i<4;i++){const nx=x+dx*i,ny=y+dy*i;if(nx<0||nx>3||ny<0||ny>3||board[ny][nx]!==p){line.length=0;break}line.push([nx,ny])}if(line.length===4)return line}return[]}function dir(ring){return ring===outer?(mode===1||mode===3?1:-1):(mode===1||mode===4?1:-1)}function rotate(){const next=Array.from({length:4},()=>Array(4).fill(null));for(const ring of[outer,inner])ring.forEach(([x,y],i)=>{const[nx,ny]=ring[(i+dir(ring)+ring.length)%ring.length];next[ny][nx]=board[y][x]});board=next}function arrow(dx,dy){return['→',Math.atan2(dy,dx)*180/Math.PI]}function showArrows(moved){const r=$('board').getBoundingClientRect(),step=r.width/4;for(const[x,y,ring,i]of moved){const[nx,ny]=ring[(i+dir(ring)+ring.length)%ring.length],[g,deg]=arrow(nx-x,ny-y),a=document.createElement('div');a.className='flow-arrow';a.textContent=g;a.style.left=r.left+step*(x+.5)+'px';a.style.top=r.top+step*(y+.5)+'px';a.style.transform='translate(-50%,-50%) rotate('+deg+'deg)';document.body.append(a);setTimeout(()=>a.remove(),1000)}}function render(){const b=$('board'),innerSet=new Set(inner.map(([x,y])=>x+','+y));b.innerHTML='';for(let y=0;y<4;y++)for(let x=0;x<4;x++){const c=document.createElement('button');c.className='cell '+(innerSet.has(x+','+y)?'inner':'orbit');if(board[y][x]){c.classList.add('filled');const m=document.createElement('i');m.className='marble '+board[y][x];c.append(m)}c.onclick=()=>place(x,y);b.append(c)}$('whiteScore').textContent=score('white');$('blackScore').textContent=score('black');$('whiteLeft').textContent='残り '+(8-score('white'))+' 個';$('blackLeft').textContent='残り '+(8-score('black'))+' 個';$('turn').textContent=turn==='white'?'白の番':'黒の番';$('turn').className='turn '+turn;$('orbit').disabled=!placed||gameOver}function place(x,y){if(gameOver||placed||board[y][x])return;board[y][x]=turn;placed=true;$('message').textContent='置きました。「オービト」を押してください。';render()}function celebrate(winner,line){line.forEach(([x,y])=>document.querySelectorAll('.cell')[y*4+x]?.classList.add('winning'));for(let i=0;i<42;i++){const c=document.createElement('i'),colors=winner==='white'?['#fff','#f4c16b','#f7f3e8']:['#20242b','#83d6d0','#b2b7c0'];c.className='confetti';c.style.background=colors[i%3];c.style.left=50+(Math.random()-.5)*12+'%';c.style.top=34+Math.random()*10+'%';c.style.setProperty('--dx',(Math.random()-.5)*70+'vw');c.style.setProperty('--dy',(Math.random()*48+12)+'vh');document.body.append(c);setTimeout(()=>c.remove(),1300)}const w=document.createElement('div');w.className='winner '+winner;w.innerHTML='<small>ORB / GAME OVER</small><strong>'+(winner==='black'?'黒の勝利！':'白の勝利！')+'</strong>';w.onclick=()=>w.remove();document.body.append(w)}function orbit(){if(!placed||gameOver)return;const moved=[];for(let y=0;y<4;y++)for(let x=0;x<4;x++)if(board[y][x]){const ring=outer.some(([rx,ry])=>rx===x&&ry===y)?outer:inner;moved.push([x,y,ring,ring.findIndex(([rx,ry])=>rx===x&&ry===y)])}rotate();showArrows(moved);placed=false;const me=turn,other=turn==='white'?'black':'white',meLine=findLine(me),otherLine=findLine(other);if(meLine.length||otherLine.length){gameOver=true;const winner=meLine.length?me:other;$('message').textContent=meLine.length&&otherLine.length?'両者が4個並びました。今回オービトを押した側の勝ちです。':(winner==='white'?'白':'黒')+'の勝ちです！';render();celebrate(winner,meLine.length?meLine:otherLine);return}turn=other;$('message').textContent='次は'+(turn==='white'?'白':'黒')+'の番です。';render()}$('orbit').onclick=orbit;$('reset').onclick=()=>{document.querySelector('.winner')?.remove();fre </script></body></html>

<script>

const timeBar=document.createElement('div');timeBar.className='time-bar';timeBar.innerHTML='<span>時間制</span><button data-time="off" class="active">なし</button><button data-time="on">あり</button>';document.querySelector('.arena').insertBefore(timeBar,document.querySelector('.mode-bar'));
function fmt(sec){return Math.max(0,sec).toString().padStart(2,'0')+'秒'}function stopClock(){if(timerId){clearInterval(timerId);timerId=null}}function updateClock(){document.querySelector('.score.white .count').textContent=timed?'残り '+fmt(clock.white):'残り '+(8-score('white'))+' 個';document.querySelector('.score.black .count').textContent=timed?'残り '+fmt(clock.black):'残り '+(8-score('black'))+' 個'}function startClock(){if(!timed||timerId||gameOver)return;timerId=setInterval(()=>{if(gameOver){stopClock();return}clock[turn]--;updateClock();if(clock[turn]<=0){gameOver=true;placed=false;stopClock();$('message').textContent=turn==='white'?'時間切れ。黒の勝ちです！':'時間切れ。白の勝ちです！';render()}},1000)}

<script>
let timedStarted=false;const startButton=document.createElement('button');startButton.textContent='ゲーム開始';startButton.className='time-start';startButton.style.display='none';timeBar.appendChild(startButton);const freshWithTimer=fresh;fresh=function(){stopClock();clock={white:60,black:60};timedStarted=false;startButton.style.display=timed?'inline-block':'none';startButton.disabled=false;freshWithTimer();updateClock()};const placeWithTimer=place;place=function(x,y){if(timed&&!timedStarted){$('message').textContent='「ゲーム開始」を押してください。';return}placeWithTimer(x,y)};startButton.onclick=()=>{timedStarted=true;startButton.disabled=true;startButton.textContent='対戦中';$('message').textContent='白の番です。';startClock()};const oldSetTimed=setTimedMode;setTimedMode=function(value){oldSetTimed(value);timedStarted=false;startButton.style.display=value?'inline-block':'none';startButton.disabled=false;startButton.textContent='ゲーム開始';clock={white:60,black:60};updateClock()};timed=false;fresh();
